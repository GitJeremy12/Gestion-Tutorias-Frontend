<!-- login.component.html -->
<div class="login-container">
  <div class="login-card">

    <!-- Logo institucional -->
    <div class="logo-area">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
        </svg>
      </div>
    </div>

    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Sistema de Tutorías</p>

    <!-- Alerta de sesión expirada — controlada por sessionExpired -->
    <div *ngIf="sessionExpired" class="alert alert-warning">
      ⚠️ Tu sesión ha expirado. Por favor, inicia sesión nuevamente.
    </div>

    <!-- Formulario — llama a login() al hacer submit -->
    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="correo@espam.edu.ec"
          [disabled]="loading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          [disabled]="loading"
          required
        />
      </div>

      <!-- Error — controlado por la propiedad error del TS -->
      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <!-- Botón — deshabilitado mientras carga o faltan campos -->
      <button
        type="submit"
        [disabled]="loading || !email || !password"
        class="btn-primary"
      >
        <span *ngIf="!loading">Ingresar</span>
        <span *ngIf="loading" class="btn-loading">
          <span class="spinner"></span>
          Iniciando sesión...
        </span>
      </button>

    </form>

    <!-- Link a registro -->
    <div class="footer-links">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </div>

  </div>
</div>
